services:
  node1:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: memcache-go:latest
    container_name: memcache-node1
    ports:
      - "11211:11211"
    environment:
      MEMCACHE_ADDR: ":11211"
      MEMCACHE_MAX_MB: "64"
    healthcheck:
      test: ["CMD-SHELL", "printf 'version\\r\\n' | nc -w1 127.0.0.1 11211 | grep -q VERSION"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  node2:
    build:
